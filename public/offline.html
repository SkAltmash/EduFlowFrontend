<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b3a8c">
<title>You're offline · EduFlow</title>
<style>
  :root { --bg: #f8f8f6; --fg: #18181b; --muted: #71717a; --accent: #2b3a8c; --soft: #e8eaf6; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0c0c0f; --fg: #f4f4f5; --muted: #a1a1aa; --accent: #8b9cf5; --soft: #1e2140; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--fg);
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
  main { max-width: 360px; }
  .icon { width: 64px; height: 64px; margin: 0 auto 20px; display: grid; place-items: center; border-radius: 18px; background: var(--soft); color: var(--accent); }
  h1 { margin: 0; font-size: 24px; letter-spacing: -0.02em; }
  p { margin: 8px 0 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
  button { margin-top: 24px; height: 42px; padding: 0 20px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  .brand { margin-top: 32px; display: flex; justify-content: center; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .brand img { width: 20px; height: 20px; border-radius: 5px; }
</style>
</head>
<body>
<main>
  <div class="icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.8a15 15 0 0120 0M5 12.5a10 10 0 0114 0M8.5 16a5 5 0 017 0M12 20h.01M3 3l18 18"/></svg>
  </div>
  <h1>You're offline</h1>
  <p>EduFlow needs the internet for this page. Attendance you mark offline is saved on this phone and sent as soon as you're back online.</p>
  <button onclick="location.reload()">Try again</button>
  <div class="brand"><img src="/icons/icon-192.png" alt="">EduFlow</div>
</main>
<script>window.addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
